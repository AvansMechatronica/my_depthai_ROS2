spatial_detector:
  ros__parameters:
    image_topic: camera/rgb
    depth_topic: stereo/depth
    depth_raw_topic: stereo/depth_raw
    camera_info_topic: camera/camera_info
    detections_topic: spatial_detections

    width: 512
    height: 384
    fps: 8.0

    queue_size: 1
    reconnect_cooldown_sec: 2.0
    max_reconnect_attempts: 0

    pipeline_mode: v3
    depth_source: stereo
    stereo_extended_disparity: false

    blob_name: SimpleFruitsYoloV8.blob
    config_name: SimpleFruitsYoloV8.json
    nn_archive: SimpleFruitsYoloV8.rvc2.tar.xz

    show_bounding_boxes: true
    publish_images: true

    auto_degrade_on_reconnect: true
    reconnect_degrade_threshold: 2
    degraded_fps: 3.0
    data_stall_timeout_sec: 5.0

    spatial_calc_algorithm: MIN
